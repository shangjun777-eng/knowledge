{{ define "body-class" }}template-search{{ end }}

{{ define "main" }}
<article class="main-article">
    <header class="article-header">
        <h1 class="article-title">{{ .Title }}</h1>
    </header>

    <div class="article-content">
        <link rel="stylesheet" href="{{ "pagefind/pagefind-ui.css" | relURL }}">
        <script src="{{ "pagefind/pagefind-ui.js" | relURL }}"></script>

        <div id="search"></div>
        <noscript>请启用 JavaScript 使用站内搜索。</noscript>
    </div>
</article>

<script>
window.addEventListener("DOMContentLoaded", function () {
    if (!window.PagefindUI) return;

    var ui = new PagefindUI({
        element: "#search",
        bundlePath: '{{ "pagefind/" | relURL }}',
        showSubResults: true,
        translations: {
            placeholder: "搜索文章…",
            zero_results: "没有找到与 [SEARCH_TERM] 相关的内容",
            many_results: "找到 [COUNT] 条结果",
            one_result: "找到 1 条结果",
            searching: "搜索中…"
        }
    });

    // 支持首页搜索小部件提交的 ?keyword=...
    var keyword = new URLSearchParams(window.location.search).get("keyword");
    if (keyword) {
        setTimeout(function () {
            if (typeof ui.triggerSearch === "function") {
                ui.triggerSearch(keyword);
                return;
            }
            var input = document.querySelector("#search input[type='search'], #search .pagefind-ui__search-input");
            if (input) {
                input.value = keyword;
                input.dispatchEvent(new Event("input", { bubbles: true }));
            }
        }, 0);
    }
});
</script>
{{ end }}
